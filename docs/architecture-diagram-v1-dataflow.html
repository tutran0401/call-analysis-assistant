<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng dữ liệu — Sprint 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:  'Be Vietnam Pro', system-ui, sans-serif;
      --font-serif: 'Lora', 'Noto Serif', 'Noto Serif KR', 'Noto Serif TC', serif;
      --font-mono:  'Roboto Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Kiến trúc Sprint 1</p>
    <h1>Luồng dữ liệu chạy thật trong Sprint 1</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-flow-title arch-flow-desc">
        <title id="arch-flow-title">Luồng dữ liệu Sprint 1</title>
        <desc id="arch-flow-desc">Bảy bước xử lý một cuộc gọi từ CLI qua Application, Ingest, Domain, Analysis, Report tới stdout; Elasticsearch là kho signaling thật, ba khối nét đứt (Sanitizer, AI Analysis Engine, Web UI) là phần Sprint 2 chưa xây.</desc>
        <defs>
          <marker id="df-arrow"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="df-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= connectors (before boxes) ================= -->
        <!-- main flow, left to right -->
        <line x1="196" y1="148" x2="228" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <line x1="368" y1="148" x2="400" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <line x1="540" y1="148" x2="572" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <line x1="712" y1="148" x2="744" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <line x1="884" y1="148" x2="916" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <line x1="1056" y1="148" x2="1088" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>

        <!-- Ingest <-> Elasticsearch (external store) -->
        <line x1="470" y1="192" x2="470" y2="296" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#df-arrow-link)"/>
        <rect x="482" y="238" width="120" height="14" fill="#f5f5f5"/>
        <text x="488" y="248" fill="#2e5aa8" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="start" letter-spacing="0.06em">SIGNALING DATA</text>

        <!-- future Sprint 2 chain (dashed) -->
        <line x1="814" y1="192" x2="814" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#df-arrow)"/>
        <line x1="884" y1="340" x2="916" y2="340" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#df-arrow)"/>
        <line x1="986" y1="296" x2="986" y2="192" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#df-arrow)"/>
        <line x1="1158" y1="192" x2="1158" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#df-arrow)"/>

        <!-- ================= main row (Sprint 1, chạy thật) ================= -->
        <!-- CLI -->
        <rect x="56" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="126" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLI</text>
        <text x="126" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Entrypoint dòng lệnh</text>
        <text x="126" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Dispatcher → Command</text>

        <!-- Application (focal) -->
        <rect x="228" y="104" width="140" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="298" y="124" fill="#eb6c36" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>
        <text x="298" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Pipeline điều phối</text>
        <text x="298" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">CallAnalysisPipeline</text>

        <!-- Ingest -->
        <rect x="400" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="470" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INGEST</text>
        <text x="470" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Nạp &amp; chuẩn hoá log</text>
        <text x="470" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Parser + Signaling</text>

        <!-- Domain -->
        <rect x="572" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="642" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DOMAIN</text>
        <text x="642" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Canonical Event</text>
        <text x="642" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">callId · leg · ts</text>

        <!-- Analysis -->
        <rect x="744" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="814" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ANALYSIS</text>
        <text x="814" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Rule Verdict Engine</text>
        <text x="814" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Timeline→Metrics→Rule</text>

        <!-- Report -->
        <rect x="916" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="986" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REPORT</text>
        <text x="986" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Lắp ráp báo cáo</text>
        <text x="986" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">Assembler + Guard</text>

        <!-- Stdout -->
        <rect x="1088" y="104" width="140" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1158" y="124" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTPUT</text>
        <text x="1158" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">In ra màn hình</text>
        <text x="1158" y="166" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">report text · CLI</text>

        <!-- ================= aux row: kho dữ liệu + Sprint 2 (nét đứt) ================= -->
        <!-- Elasticsearch (store) -->
        <rect x="400" y="296" width="140" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="470" y="316" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INFRA</text>
        <text x="470" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Elasticsearch</text>
        <text x="470" y="358" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">kho signaling.json</text>

        <!-- Sanitizer (Sprint 2) -->
        <rect x="744" y="296" width="140" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="814" y="316" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SPRINT 2</text>
        <text x="814" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Sanitizer I/O</text>
        <text x="814" y="358" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">chưa triển khai</text>

        <!-- AI Analysis Engine (Sprint 2) -->
        <rect x="916" y="296" width="140" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="986" y="316" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SPRINT 2</text>
        <text x="986" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">AI Analysis Engine</text>
        <text x="986" y="358" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">chưa triển khai</text>

        <!-- Web UI (Sprint 2) -->
        <rect x="1088" y="296" width="140" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="1158" y="316" fill="#7a8399" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SPRINT 2</text>
        <text x="1158" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Web UI</text>
        <text x="1158" y="358" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" text-anchor="middle">thay CLI</text>

        <!-- ================= annotation callout ================= -->
        <text x="228" y="212" fill="#2d3142" font-size="13" font-style="italic" font-family="'Lora', serif">Đọc đúng một class để hiểu toàn hệ thống:</text>
        <text x="228" y="228" fill="#2d3142" font-size="13" font-style="italic" font-family="'Lora', serif">CallAnalysisPipeline — tám dòng, tám bước.</text>

        <!-- ================= caption ================= -->
        <text x="640" y="470" fill="#7a8399" font-size="9" font-family="'Roboto Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SPRINT 1 CHẠY THẬT: CLI → APPLICATION → INGEST → DOMAIN → ANALYSIS → REPORT → STDOUT · KHỐI NÉT ĐỨT = KẾ HOẠCH SPRINT 2</text>

        <!-- ================= legend ================= -->
        <line x1="56" y1="624" x2="1228" y2="624" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="56" y="646" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="150" y1="642" x2="174" y2="642" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#df-arrow)"/>
        <text x="182" y="646" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">LUỒNG XỬ LÝ SPRINT 1</text>

        <line x1="392" y1="642" x2="416" y2="642" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#df-arrow)"/>
        <text x="424" y="646" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">MỞ RỘNG SPRINT 2 (DỰ KIẾN)</text>

        <rect x="676" y="636" width="14" height="14" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="698" y="646" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">KHO DỮ LIỆU (ELASTICSEARCH)</text>

        <rect x="936" y="636" width="14" height="14" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="958" y="646" fill="#4f5d75" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.06em">LỚP TRUNG TÂM CỦA PIPELINE</text>
      </svg>
    </div>
  </div>
</body>
</html>
