spring:
  config:
    # Đọc file .env (KEY=VALUE) ở thư mục chạy nếu có; không có thì bỏ qua. .env nằm trong .gitignore.
    import: optional:file:.env[.properties]
  main:
    web-application-type: none
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

elasticsearch:
  host: localhost
  port: 9200
  signaling-index: call-signaling-events
  # Timeout cho mọi lời gọi ES (Sprint 3 T4)
  connect-timeout-ms: 2000
  socket-timeout-ms: 5000

call-analysis:
  ai:
    # none | fake | openai. Để openai thì đặt biến môi trường OPENAI_API_KEY (không commit key vào repo).
    provider: ${CALL_ANALYSIS_AI_PROVIDER:none}
    # Hạn chót cứng cho cả lần gọi (gồm retry); phải >= openai.timeout-ms * openai.max-attempts.
    timeout-ms: 30000
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      timeout-ms: 12000
      max-attempts: 2
  sanitizer:
    # Đặt salt cố định khi chạy Evaluation Runner để pseudonym giống nhau giữa các lần chạy.
    pseudonym-salt: ${CALL_ANALYSIS_PSEUDONYM_SALT:}
  # Ngưỡng cảnh báo chất lượng của rule baseline (Sprint 1). Data mẫu không kèm ground truth để
  # hiệu chỉnh, nên đây là giá trị baseline đã ghi trong tài liệu; việc siết chặt bằng dữ liệu
  # accuracy thật là công việc của Sprint 3 T1.
  quality-thresholds:
    packet-loss-percent: 5.0
    jitter-ms: 30.0
    rtt-ms: 300.0
    mos: 3.5
    signaling-retransmit-count: 2
