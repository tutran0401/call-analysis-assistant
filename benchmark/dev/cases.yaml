# Benchmark `dev` (PROJECT_SPEC.md mục 6.3). Định dạng: mỗi case = 1 cuộc gọi + 3-5 cách hỏi.
#
# NGUỒN NHÃN - đọc trước khi diễn giải accuracy:
#   * expected_verdict của success/ và fail/ là nhãn do mentor gắn sẵn (theo tên thư mục).
#   * expected_issue_category CHƯA có nhãn từ mentor. Giá trị ở đây là kết quả của rule engine Sprint 1,
#     đã được kiểm tay với log thô (docs/sample-run-report.md) - nên "Issue Category Accuracy" của rule
#     trên tập này là 100% theo cách xây, chỉ có ý nghĩa để so AI với rule, không phải độ chính xác thật.
#   * for_test/ không có nhãn mentor: verdict + category là kiểm tay.
#   * expected_evidence bỏ trống: chưa có ground truth Evidence ID từ mentor.
#   * Issue Category Accuracy CHỈ tính case có label_source chứa "category=mentor" (Mentor review Sprint 2).
#     Nhãn tạm ở trên vẫn được dùng cho chỉ số "Category khớp nhãn tạm lấy từ rule" - không phải accuracy.
#     Xin nhãn: benchmark/dev/category-labels-for-mentor.csv (gán mù, không kèm kết quả rule). Khi Mentor
#     điền xong: chép mentor_issue_category vào expected_issue_category và đổi label_source thành
#     "verdict=mentor-folder; category=mentor".
#   * Các case var-* là biến thể file suy từ cuộc gọi gốc; label_source nói rõ nhãn đến từ đâu.
# Tham chiếu file: <tên file> trong thư mục cuộc gọi, hoặc {from: <callId>/<tên file>, as: <tên đính kèm>}.

